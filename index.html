 <!-- Document Type is HTML  -->
 <!DOCTYPE html>
 <!-- Roof element of the website and an attribute that tell the main language of the website -->
 <html lang="en"> 
    <!-- Most things here are not display on the website but control the effect of the website -->
    <head> 
        <!-- It help determine the browser encoding character to use -->
        <meta charset="urf-8"> 
        <!-- It control the configuring of the website viewpoint -->
        <meta name="viewpoint"> 
        <!-- It helps to give the website a title and can be seen on the brower tab -->
        <title>HTML Assignment 01</title> 
    </head>
    <!-- The body contains the actual content that will be display on the website -->
    <body>
        <!-- Headers -->
        <h1>Welcome Mentor!</h1>
        <!-- Three Paragraphs -->
         <p>My name is Sunday Alabi</p>
         <p>HTML is used to create the structure of webpages.</p>
         <p>I am learning how different HTML elements work together.</p>
    </body>
</html>
